# ============================================================================
# EYG TIRE & AUTO CARE — Secret scanning
# ============================================================================
# Three layers, because no single one catches everything:
#
#   1. gitleaks, on every push and PR, scanning the full history with a
#      allowlist for the handful of false positives this codebase produces.
#   2. scripts/predeploy-check.mjs, which is already the deployment gate and
#      adds shape-based rules the pipeline needs anyway.
#   3. A committed-.env / committed-backup check, because the most common way a
#      database credential escapes is not a code leak — it is `git add -A`
#      picking up a .env or a pg_dump someone left in the repo root.
#
# ---------------------------------------------------------------------------
# WHY PUSHES MATTER TOO
# A PR-only secret scan is a race you lose: the author pushes the commit to
# their fork, the scan runs, and if it fails the fix commit still contains the
# key in the history. Scanning on push to main is the backstop.
#
# ---------------------------------------------------------------------------
# ROTATION IS THE ONLY REAL FIX
# This workflow reports. It cannot un-leak. The procedure for a real exposure
# is in docs/ops/INCIDENT-RESPONSE.md §SEV1: revoke, rotate, then force-push or
# accept the history. Assume anything this workflow flags has been exposed.
# ============================================================================

name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 04:23 UTC = 12:23 Manila. Catches a secret that was force-pushed
    # away and exists only in a dangling ref.
    - cron: "23 4 * * 0"
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1. gitleaks over the full history
  # ==========================================================================
  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; renovate bumps it)
        with:
          # gitleaks needs every commit to scan. `--depth 0`.
          fetch-depth: 0

      # gitleaks is not an official action; it is installed from the upstream
      # release binary with a pinned checksum. Using a third-party action would
      # mean trusting an unpinnable dependency for the exact task of reading
      # every secret in the repository.
      - name: Install gitleaks (pinned release + checksum)
        id: gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.2"
          ARCH="x64"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"
          curl -sSfL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          echo "version=${GITLEAKS_VERSION}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
        # ---------------------------------------------------------------------
        # Path exclusions only.
        #
        # There are deliberately NO pattern allowlists here. The four that used to be
        # in this file were written as `[[rules]]`, which in gitleaks ADDS DETECTORS
        # rather than tolerating them — so the allowlist was generating 22 of the 26
        # findings it was meant to explain, including a hit on every `openssl rand`
        # line in docs/. `[[allowlists]]` was also tried and does not suppress by path
        # in gitleaks 8.24.
        #
        # The real false positives are four fake test fixtures. They are marked in place
        # with `gitleaks:allow` comments, which is narrower than any path exclusion:
        # a live key pasted into a test file trips a different rule and is still caught.
        #
        # A broad regex allowlist is the most common way a secret scanner is silently
        # neutered. If something is reported that you believe is a false positive, put
        # `gitleaks:allow` on that exact line and say why — never a pattern that could
        # match a real key.
      # Allowlist.
      #
      # Every entry is a false positive WE HAVE VERIFIED. Keep it tiny — an
      # allowlist that grows is an allowlist that stops working.
      #
      # `scripts/*.mjs` legitimately contains the regexes that DETECT secrets,
      # and `.env.example` legitimately contains variable NAMES with empty
      # values. Those two are the only structural sources of noise here.
      # ---------------------------------------------------------------------
      - name: Generate the allowlist
        run: |
          cat > /tmp/gitleaks.toml <<'TOML'
          title = "EYG Tire & Auto Care — gitleaks allowlist"

          [extend]
            # The default rule set ONLY. The extra `[[rules]]` that used to sit here
            # were not allowlist entries at all — in gitleaks, `[[rules]]` ADDS
            # DETECTORS. They were generating 22 of the 26 findings on the first real
            # scan, including one for every `openssl rand` line in docs/.
            useDefault = true


          # -------------------------------------------------------------------
          # Paths, not rules. These directories can never contain a live secret
          # and scanning them only produces noise.
          # -------------------------------------------------------------------
          [allowlist]
          paths = [
            '''(^|/)node_modules/''',
            '''(^|/)\.next/''',
            '''(^|/)coverage/''',
            '''(^|/)backups/''',
            '''(^|/)public/''',
            '''(^|/)brand/''',
            '''\.(png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|eot|pdf|zip|gz)$''',
            '''(^|/)public/og/''',
          ]

            # NOTE: there is no `regexes` allowlist here, and that is deliberate.
            # A broad regex allowlist is the most common way a secret scanner is
            # silently neutered, and gitleaks 8.24 does not honour `[[allowlists]]`
            # `paths` for suppression anyway.
            #
            # The genuine false positives are four fake test fixtures. Each carries a
            # `gitleaks:allow` comment on its own line, which is narrower than any path
            # exclusion: a live key pasted into a test file trips a DIFFERENT rule and is
            # still caught. If a new one appears, annotate that line and say why.
            TOML
          echo "Allowlist written to /tmp/gitleaks.toml"
        # `--redact` prints `REDACTED` instead of the matched value. This is the
        # difference between a scan log that is safe to paste into a chat and one
        #
        # `--baseline-path` accepts findings this repository has already reviewed. It is
        # required because `gitleaks:allow` only silences a line in the CURRENT tree,
        # while this scan walks every commit: the four fake test fixtures in 5ffaf85
        # are reported forever regardless of how those files look today.
        #
        # The baseline is FINGERPRINT-scoped, so it suppresses exactly those four and
        # nothing else. Regenerate with `npm run verify:secrets:baseline`.
        #
        # Do NOT replace it with a path allowlist over tests/ or vitest.config.ts. A
        # real key pasted into a test file trips a different rule at a different
        # fingerprint, and a path exclusion would hide it. That was tested: with the
        # baseline in place, a planted `ghp_` PAT is still caught.
        # that is a credential dump.
      - name: Scan the full history
        run: |
          set -euo pipefail

          # -------------------------------------------------------------------
          # WHY THIS DOES NOT SIMPLY `gitleaks ... || echo "secret found"`
          #
          # gitleaks exits 1 for BOTH "found a secret" and "could not load its
          # config". Verified against the pinned binary:
          #
          #   invalid config    FTL unable to load gitleaks config   exit 1
          #   findings present  WRN leaks found: 4                    exit 1
          #   clean             INF no leaks found                   exit 0
          #
          # Collapsing those into one message is how a scanner that was silently
          # scanning NOTHING ends up reading as a clean bill of health. So the
          # report file is the discriminator: findings produce a non-empty
          # report, a broken scan produces none.
          #
          # A MISSING BASELINE is worse still. gitleaks ignores a baseline file
          # that is not there, without a word, and simply scans stricter - so its
          # absence is checked explicitly rather than inferred.
          # -------------------------------------------------------------------
          if [ ! -f .gitleaks-baseline.json ]; then
            echo "::error title=Missing gitleaks baseline::.gitleaks-baseline.json is not in the checkout. gitleaks silently ignores a missing baseline and just scans stricter, which would fail this gate for no stated reason. Regenerate with: npm run verify:secrets:baseline"
            exit 1
          fi

          code=0
          /tmp/gitleaks detect \
            --source . \
            --config /tmp/gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact \
            --verbose \
            --no-banner \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            > /tmp/gitleaks.log 2>&1 || code=$?

          if [ "$code" -eq 0 ]; then
            echo "gitleaks: no secrets in history."
            exit 0
          fi

          if [ -s /tmp/gitleaks-report.json ] \
             && node -e 'const r=require("/tmp/gitleaks-report.json"); process.exit(r.length>0?0:1)'; then
            echo "::error title=Secret detected in git history::gitleaks found a credential. The matched VALUE is redacted by design - do not remove --redact."
            echo ""
            node -e '
              const r = require("/tmp/gitleaks-report.json");
              const seen = new Set();
              for (const f of r) {
                const k = f.RuleID + "|" + f.File;
                if (seen.has(k)) continue;
                seen.add(k);
                console.error(`  ${f.RuleID}  ${f.File}:${f.StartLine}  (commit ${String(f.Commit).slice(0, 8)}, ${f.Author}, ${f.Date})`);
              }
            ' || true
            echo ""
            echo "See docs/ops/INCIDENT-RESPONSE.md - rotate first, clean history second."
            exit 1
          fi

          echo "::error title=gitleaks could not run::exit $code with no findings in the report. That is a broken scanner, NOT a clean repository, and the two must not be confused."
          echo ""
          cat /tmp/gitleaks.log
          exit 1
      - name: Upload the (redacted) report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA-pinned; renovate bumps it)
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: /tmp/gitleaks-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================================
  # 2. Committed secrets, caught by the deployment gate's own rules
  # ==========================================================================
  predeploy-scan:
    name: secret shapes in the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; renovate bumps it)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned; renovate bumps it)
        with:
          node-version: "20.11.0"

      # predeploy-check reports the file, line and rule NAME only. It never
      # prints a matched value, so this log is safe to link from an incident.
      - name: Run the deployment gate's secret rules
        run: |
          set -euo pipefail
          node scripts/predeploy-check.mjs --json --skip-branch --allow-placeholders > /tmp/secrets.json || true
          if grep -q '"secret\.' /tmp/secrets.json; then
            echo "::error title=Possible committed credential::The file/line/rule list is below. The matched value is deliberately withheld from this log."
            node -e '
              const r = require("/tmp/secrets.json");
              for (const b of r.blocking.filter((x) => x.startsWith("secret."))) console.error("  " + b);
            '
            exit 1
          fi
          echo "No secret shapes in the tracked tree."

      - name: Refuse a committed .env or a committed database dump
        run: |
          set -euo pipefail
          failed=0

          # .env.example is the contract and IS committed. .env is the secret
          # and must never be.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error title=.env committed::Remove with 'git rm --cached .env'. ROTATE every value in it first — it is in the history."
            failed=1
          fi
          for f in .env.local .env.production .env.staging; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error title=${f} committed::Remove it and rotate its contents."
              failed=1
            fi
          done

            # `prisma/migrations/**/migration.sql` is EXCLUDED deliberately. Those
            # files are schema DDL: required, committed by definition, and holding no
            # customer data. A `.sql` file OUTSIDE that directory is a data dump and
            # is still refused. Without the exclusion this gate blocks every push on
            # its own migrations, which is how a real dump would slip past unnoticed.

          # A pg_dump contains every customer's name and phone number. Committing
          # one is a data breach even if it is encrypted.
          if git ls-files | grep -v '^prisma/migrations/' | grep -qE '\.(dump|sql|sql\.gz|backup|tar\.gz)$'; then
            echo "::error title=Database dump committed::A .dump/.sql file in the repository is a breach of customer PII. Remove it, then assess whether it needs reporting."
            git ls-files | grep -v '^prisma/migrations/' | grep -E '\.(dump|sql|sql\.gz|backup|tar\.gz)$' | sed 's/^/  /'
            failed=1
          fi

          # A stray key file is the other classic.
          if git ls-files | grep -qE '\.(pem|p12|pfx|key)$'; then
            echo "::error title=Key material committed::"
            git ls-files | grep -E '\.(pem|p12|pfx|key)$' | sed 's/^/  /'
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "See docs/ops/INCIDENT-RESPONSE.md §SEV1."
            exit 1
          fi
          echo "No committed .env, dump or key material."

  # ==========================================================================
  # 3. Confirm the local hooks are installed
  # ==========================================================================
  hooks-installed:
    name: local hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; renovate bumps it)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned; renovate bumps it)
        with:
          node-version: "20.11.0"

      # This only reports. A developer who has not run install-hooks.mjs on
      # their machine is not broken — CI is the gate — but knowing who needs the
      # reminder is useful during onboarding.
      - name: Report the local hook status
        run: |
          set -euo pipefail
          node scripts/install-hooks.mjs --check
          echo ""
          echo "::notice title=Local hooks::Run 'node scripts/install-hooks.mjs' once after cloning. pre-commit blocks placeholders and secrets before they reach the remote; pre-push runs tsc."
