# ============================================================================
# EYG TIRE & AUTO CARE — Secret scanning
# ============================================================================
# Three layers, because no single one catches everything:
#
#   1. gitleaks, on every push and PR, scanning the full history with a
#      allowlist for the handful of false positives this codebase produces.
#   2. scripts/predeploy-check.mjs, which is already the deployment gate and
#      adds shape-based rules the pipeline needs anyway.
#   3. A committed-.env / committed-backup check, because the most common way a
#      database credential escapes is not a code leak — it is `git add -A`
#      picking up a .env or a pg_dump someone left in the repo root.
#
# ---------------------------------------------------------------------------
# WHY PUSHES MATTER TOO
# A PR-only secret scan is a race you lose: the author pushes the commit to
# their fork, the scan runs, and if it fails the fix commit still contains the
# key in the history. Scanning on push to main is the backstop.
#
# ---------------------------------------------------------------------------
# ROTATION IS THE ONLY REAL FIX
# This workflow reports. It cannot un-leak. The procedure for a real exposure
# is in docs/ops/INCIDENT-RESPONSE.md §SEV1: revoke, rotate, then force-push or
# accept the history. Assume anything this workflow flags has been exposed.
# ============================================================================

name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 04:23 UTC = 12:23 Manila. Catches a secret that was force-pushed
    # away and exists only in a dangling ref.
    - cron: "23 4 * * 0"
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1. gitleaks over the full history
  # ==========================================================================
  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; renovate bumps it)
        with:
          # gitleaks needs every commit to scan. `--depth 0`.
          fetch-depth: 0

      # gitleaks is not an official action; it is installed from the upstream
      # release binary with a pinned checksum. Using a third-party action would
      # mean trusting an unpinnable dependency for the exact task of reading
      # every secret in the repository.
      - name: Install gitleaks (pinned release + checksum)
        id: gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.2"
          ARCH="x86_64"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"
          curl -sSfL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          echo "version=${GITLEAKS_VERSION}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Allowlist.
      #
      # Every entry is a false positive WE HAVE VERIFIED. Keep it tiny — an
      # allowlist that grows is an allowlist that stops working.
      #
      # `scripts/*.mjs` legitimately contains the regexes that DETECT secrets,
      # and `.env.example` legitimately contains variable NAMES with empty
      # values. Those two are the only structural sources of noise here.
      # ---------------------------------------------------------------------
      - name: Generate the allowlist
        run: |
          cat > /tmp/gitleaks.toml <<'TOML'
          title = "EYG Tire & Auto Care — gitleaks allowlist"

          [extend]
          # Use the default rule set plus the extra rules that catch the
          # provider shapes this project actually uses (Vercel, Resend, Twilio,
          # Upstash, Neon, Supabase).
          useDefault = true

          [[rules]]
          id = "eyg-detector-scripts"
          description = "scripts/ contains the patterns that DETECT secrets, not secrets"
          regex = '''(?i)sk_(live|test)_[A-Za-z0-9]{16,}'''
          path = '''scripts/'''

          [[rules]]
          id = "eyg-example-vars"
          description = ".env.example ships variable names with empty values"
          regex = '''(?i)(SECRET|TOKEN|PASSWORD|KEY)\s*=\s*$'''
          path = '''^\.env\.example$'''

          [[rules]]
          id = "eyg-docs-examples"
          description = "docs/ quotes the variable NAMES and shapes to document them"
          regex = '''(?i)(openssl rand|sk_live_|AKIA[0-9A-Z]{16})'''
          path = '''^docs/'''

          [[rules]]
          id = "eyg-lockfile"
          description = "Integrity hashes in package-lock.json are not credentials"
          path = '''package-lock\.json$'''

          # -------------------------------------------------------------------
          # Paths, not rules. These directories can never contain a live secret
          # and scanning them only produces noise.
          # -------------------------------------------------------------------
          [allowlist]
          paths = [
            '''(^|/)node_modules/''',
            '''(^|/)\.next/''',
            '''(^|/)coverage/''',
            '''(^|/)backups/''',
            '''(^|/)public/''',
            '''(^|/)brand/''',
            '''\.(png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|eot|pdf|zip|gz)$''',
            '''(^|/)public/og/''',
          ]

          # NOTE: there is deliberately no global `regexes` allowlist here.
          # A broad regex allowlist is the single most common way a secret
          # scanner is silently neutered. If gitleaks reports something you
          # believe is a false positive, add a TIGHT path-scoped rule above and
          # say why in a comment — never a pattern that could match a real key.
          TOML
          echo "Allowlist written to /tmp/gitleaks.toml"

      # `--redact` prints `REDACTED` instead of the matched value. This is the
      # difference between a scan log that is safe to paste into a chat and one
      # that is a credential dump.
      - name: Scan the full history
        run: |
          set -euo pipefail
          /tmp/gitleaks detect \
            --source . \
            --config /tmp/gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --report-format json \
            --report-path /tmp/gitleaks-report.json \
            || {
              echo "::error title=Secret detected in git history::gitleaks found a credential. The matched VALUE is redacted by design — do not remove --redact."
              echo ""
              node -e '
                const r = require("/tmp/gitleaks-report.json");
                const seen = new Set();
                for (const f of r) {
                  const k = f.RuleID + "|" + f.File;
                  if (seen.has(k)) continue;
                  seen.add(k);
                  console.error(`  ${f.RuleID}  ${f.File}:${f.StartLine}  (commit ${String(f.Commit).slice(0, 8)}, ${f.Author}, ${f.Date})`);
                }
              ' || true
              echo ""
              echo "See docs/ops/INCIDENT-RESPONSE.md §SEV1 — rotate first, clean history second."
              exit 1
            }
          echo "gitleaks: no secrets in history."

      - name: Upload the (redacted) report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA-pinned; renovate bumps it)
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: /tmp/gitleaks-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================================================
  # 2. Committed secrets, caught by the deployment gate's own rules
  # ==========================================================================
  predeploy-scan:
    name: secret shapes in the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; renovate bumps it)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned; renovate bumps it)
        with:
          node-version: "20.11.0"

      # predeploy-check reports the file, line and rule NAME only. It never
      # prints a matched value, so this log is safe to link from an incident.
      - name: Run the deployment gate's secret rules
        run: |
          set -euo pipefail
          node scripts/predeploy-check.mjs --json --skip-branch --allow-placeholders > /tmp/secrets.json || true
          if grep -q '"secret\.' /tmp/secrets.json; then
            echo "::error title=Possible committed credential::The file/line/rule list is below. The matched value is deliberately withheld from this log."
            node -e '
              const r = require("/tmp/secrets.json");
              for (const b of r.blocking.filter((x) => x.startsWith("secret."))) console.error("  " + b);
            '
            exit 1
          fi
          echo "No secret shapes in the tracked tree."

      - name: Refuse a committed .env or a committed database dump
        run: |
          set -euo pipefail
          failed=0

          # .env.example is the contract and IS committed. .env is the secret
          # and must never be.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error title=.env committed::Remove with 'git rm --cached .env'. ROTATE every value in it first — it is in the history."
            failed=1
          fi
          for f in .env.local .env.production .env.staging; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error title=${f} committed::Remove it and rotate its contents."
              failed=1
            fi
          done

          # A pg_dump contains every customer's name and phone number. Committing
          # one is a data breach even if it is encrypted.
          if git ls-files | grep -qE '\.(dump|sql|sql\.gz|backup|tar\.gz)$'; then
            echo "::error title=Database dump committed::A .dump/.sql file in the repository is a breach of customer PII. Remove it, then assess whether it needs reporting."
            git ls-files | grep -E '\.(dump|sql|sql\.gz|backup|tar\.gz)$' | sed 's/^/  /'
            failed=1
          fi

          # A stray key file is the other classic.
          if git ls-files | grep -qE '\.(pem|p12|pfx|key)$'; then
            echo "::error title=Key material committed::"
            git ls-files | grep -E '\.(pem|p12|pfx|key)$' | sed 's/^/  /'
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "See docs/ops/INCIDENT-RESPONSE.md §SEV1."
            exit 1
          fi
          echo "No committed .env, dump or key material."

  # ==========================================================================
  # 3. Confirm the local hooks are installed
  # ==========================================================================
  hooks-installed:
    name: local hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned; renovate bumps it)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned; renovate bumps it)
        with:
          node-version: "20.11.0"

      # This only reports. A developer who has not run install-hooks.mjs on
      # their machine is not broken — CI is the gate — but knowing who needs the
      # reminder is useful during onboarding.
      - name: Report the local hook status
        run: |
          set -euo pipefail
          node scripts/install-hooks.mjs --check
          echo ""
          echo "::notice title=Local hooks::Run 'node scripts/install-hooks.mjs' once after cloning. pre-commit blocks placeholders and secrets before they reach the remote; pre-push runs tsc."
